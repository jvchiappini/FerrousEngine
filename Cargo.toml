[workspace]
members = [
    "crates/ferrous_ecs",
    "crates/ferrous_core",
    "crates/ferrous_renderer",
    "crates/ferrous_editor",
    "crates/ferrous_gui",
    "crates/ferrous_assets",
    "crates/ferrous_engine",
    "crates/ferrous_asset_types",
    "crates/ferrous_font",
    "crates/ferrous_render_graph",
    "crates/ferrous_ecs_macros",
    "crates/ferrous_ui_core",
    "crates/ferrous_layout",
    "crates/ferrous_events", "crates/ferrous_ui_render",
    "crates/ferrous_ui_macros",
    "crates/ferrous_voxels",
    "crates/ferrous_svg", "crates/ferrous_state", "crates/ferrous_reflection",
    "crates/ferrous_web", "crates/ferrous_2d",
    "crates/guimaker",
    "crates/guimaker_ferrous",
    "crates/guimaker_gallery",
]
resolver = "2"

[workspace.dependencies]
rustc-hash = "2.1.3"
# Canonical wgpu feature set for the whole workspace.  `default-features =
# false` + the explicit list below is byte-for-byte equivalent to wgpu 23.0.1's
# `default = ["wgsl", "dx12", "metal", "webgpu"]` plus the `webgl` (which pulls
# `wgc/gles`) and `fragile-send-sync-non-atomic-wasm` features this workspace
# already enabled.  Vulkan is NOT a wgpu feature: wgpu 23.0.1 always enables
# `wgc/vulkan` for Windows and non-Apple Unix through a target-specific
# dependency, so Windows/Linux keep Vulkan regardless of these features.
wgpu = { version = "23.0", default-features = false, features = ["wgsl", "dx12", "metal", "webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
# el motor tendrá su propio sistema de UI; ya no dependemos de egui
winit = "0.30"
log = "0.4"
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ferrous_ecs = { path = "crates/ferrous_ecs" }
ferrous_gpu = { path = "crates/ferrous_gpu" }

[package]
name = "guimaker"
version = "0.1.0"
edition = "2021"
publish = false
description = "GUIMaker: the FerrousEngine design system and UI library core."
license = "Apache-2.0"
repository = "https://github.com/jvchiappini/FerrousEngine"

[dependencies]
serde = { workspace = true }
ron = "0.8"
glam = { workspace = true }
taffy = "0.7.7"
unicode-segmentation = "1.13"

[dev-dependencies]
divan = "0.1.21"
glam = { workspace = true }

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "input"
harness = false

[[bench]]
name = "controllers"
harness = false

[package]
name = "ferrous_assets"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { workspace = true, optional = true }
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"], optional = true }
image = { version = "0.24", optional = true }
gltf = { version = "1.4", features = ["import", "utils"] }
half = { version = "2.3", optional = true }
ferrous_font = { path = "../ferrous_font", optional = true }
resvg = { version = "0.33", optional = true }
ferrous_asset_types = { path = "../ferrous_asset_types" }
log = { workspace = true }

[features]
# Image decoding (`ImageData`, `Texture2d::from_file`/`from_hdr`, the glTF
# loader) is on by default so existing consumers are unchanged.  Note the
# separate `gltf` crate keeps its own `image 0.25`; this feature only governs
# ferrous_assets' own `image 0.24` dependency.
default = ["image"]
image = ["dep:image"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:half"]
text = ["dep:ferrous_font", "gpu"]
svg = ["dep:resvg"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.7"
notify = "6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[dev-dependencies]
pollster = "0.3"

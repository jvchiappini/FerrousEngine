[package]
name = "ferrous_renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
ferrous_2d = { path = "../ferrous_2d" }
wgpu = { workspace = true }
anyhow = "1.0"
thiserror = "1.0"
ferrous_core = { path = "../ferrous_core", features = ["ecs", "input", "gpu"] }
ferrous_ecs = { path = "../ferrous_ecs" }
ferrous_gpu = { path = "../ferrous_gpu" }
ferrous_render_graph = { path = "../ferrous_render_graph" }
ferrous_gui = { path = "../ferrous_gui", optional = true }
ferrous_ui_render = { path = "../ferrous_ui_render", optional = true }
bytemuck = { version = "1.14", features = ["derive"] }
glam = { workspace = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
ferrous_assets = { path = "../ferrous_assets", optional = true }
log = "0.4"
rand = "0.8"
fontmesh = "0.4.1"
ttf-parser = "0.25.1"
lyon_tessellation = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"

[dev-dependencies]
# `divan` is the benchmark framework for the headless Pure2D harness.  It was
# chosen over `criterion` because it is lighter, has no group/main boilerplate,
# and its `AllocProfiler` reports allocations + bytes per iteration on stable
# Rust -- one of the hardware-independent metrics this audit requires.
divan = "0.1.21"
# `png` is used only by `examples/cad_capture.rs` to write before/after colour
# evidence for the sRGB audit (H1) to `brain/`. It is already in the workspace
# lock via `image`/`resvg`, so this adds no new transitive build.
png = "0.17"

[[bench]]
name = "pure2d_headless"
harness = false

[features]
default = ["gui"]
gui = ["dep:ferrous_gui", "dep:ferrous_ui_render"]
image = ["dep:image"]

# Enable GPU-driven indirect draw path.  When disabled the renderer compiles
# only the legacy CPU-driven `draw_indexed` path.
"gpu-driven" = []

# optional assets support; when disabled the renderer does not depend on the
# asset crate and mesh caches are omitted at compile time.
assets = ["dep:ferrous_assets", "ferrous_assets/gpu"]

# Bindless textures/materials – replaces per-material bind groups with a
# single bindless descriptor array.  Functionality is currently a stub.
bindless = []

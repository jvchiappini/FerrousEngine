[package]
name = "ferrous_renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
ferrous_2d = { path = "../ferrous_2d" }
ferrous_font = { path = "../ferrous_font" }
# Phase 9D Lane C: backend features are selected above; the `default-features`
# switch belongs in the workspace root entry (edition 2021 members cannot
# reliably override it).  The normal build is unchanged.
wgpu = { workspace = true }
anyhow = "1.0"
thiserror = "1.0"
ferrous_core = { path = "../ferrous_core", features = ["ecs", "input", "gpu"] }
ferrous_ecs = { path = "../ferrous_ecs" }
ferrous_gpu = { path = "../ferrous_gpu" }
ferrous_render_graph = { path = "../ferrous_render_graph" }
ferrous_gui = { path = "../ferrous_gui", optional = true }
ferrous_ui_render = { path = "../ferrous_ui_render", optional = true }
bytemuck = { version = "1.14", features = ["derive"] }
glam = { workspace = true }
# Phase 9D Lane C: the decoder formats are selected by the `image-png` /
# `image-jpeg` features below instead of being forced on with the dependency.
image = { version = "0.25", optional = true, default-features = false }
ferrous_assets = { path = "../ferrous_assets", optional = true }
log = "0.4"
fontmesh = "0.4.1"
ttf-parser = "0.25.1"
lyon_tessellation = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"

[dev-dependencies]
ferrous_layout = { path = "../ferrous_layout" }
ferrous_svg = { path = "../ferrous_svg" }
ferrous_ui_core = { path = "../ferrous_ui_core" }
# `divan` is the benchmark framework for the headless Pure2D harness.  It was
# chosen over `criterion` because it is lighter, has no group/main boilerplate,
# and its `AllocProfiler` reports allocations + bytes per iteration on stable
# Rust -- one of the hardware-independent metrics this audit requires.
divan = "0.1.21"
# `png` is used only by `examples/cad_capture.rs` to write before/after colour
# evidence for the sRGB audit (H1) to `brain/`. It is already in the workspace
# lock via `image`/`resvg`, so this adds no new transitive build.
png = "0.17"

[[bench]]
name = "pure2d_headless"
harness = false

[[bench]]
name = "subsystems"
harness = false

[features]
default = ["gui", "render-3d"]
gui = ["dep:ferrous_gui", "dep:ferrous_ui_render"]

# Phase 9D Lane C: the 3-D renderer (world/HDR/IBL/post pipelines and their
# resources).  The runtime `RendererMode::Flat2D` path already skips *building*
# them; this feature is the compile-time switch that removes them from a
# UI-only binary.  It is on by default so the normal build is unchanged.
# The module gates use `any(render-3d, not(flat2d))`, so the Pure2D harness and
# Motioner's `motioner_render` (which build with `default-features = false`) keep
# the 3D modules and stay behaviour-identical.  Only the opt-in `flat2d`
# selection removes them:
#   cargo build -p ferrous_renderer --no-default-features --features flat2d,gui
render-3d = []
flat2d = []

# Image decoders.  `image` keeps the previous behaviour (PNG + JPEG); a
# minimal build can pick only the format it actually loads.
image = ["image-png", "image-jpeg"]
image-png = ["dep:image", "image/png"]
image-jpeg = ["dep:image", "image/jpeg"]

# Phase 9D Lane C: wgpu backend selection, forwarded to the workspace `wgpu`
# dependency.  These are additive; the default build keeps wgpu's current
# backend set because the workspace dependency still enables default features.
# A minimal Flat2D binary selects only the backends its target uses.
# wgpu 23 has no `vulkan` feature: Windows/Linux enable it through wgpu-core's
# target dependency, so this is a marker that keeps the name explicit.
wgpu-vulkan = []
wgpu-dx12 = ["wgpu/dx12"]
# wgpu 23's GLES backend is `wgpu-core/gles`, exposed by wgpu as `webgl`.
wgpu-gl = ["wgpu/webgl"]
wgpu-metal = ["wgpu/metal"]
wgpu-webgpu = ["wgpu/webgpu"]
wgpu-webgl = ["wgpu/webgl"]
wgpu-wgsl = ["wgpu/wgsl"]

# Enable GPU-driven indirect draw path.  When disabled the renderer compiles
# only the legacy CPU-driven `draw_indexed` path.
"gpu-driven" = []

# optional assets support; when disabled the renderer does not depend on the
# asset crate and mesh caches are omitted at compile time.
assets = ["dep:ferrous_assets", "ferrous_assets/gpu"]

# Bindless textures/materials – replaces per-material bind groups with a
# single bindless descriptor array.  Functionality is currently a stub.
bindless = []

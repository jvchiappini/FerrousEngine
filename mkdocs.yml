site_name: FerrousEngine Documentation
site_url: https://jvchiappini.github.io/FerrousEngine
site_description: >
  Complete reference for FerrousEngine — a modular Rust application/game
  framework. Covers the App builder, GUI widgets, layout system, renderer,
  ECS, and asset pipeline. Optimised for both human readers and AI agents.
site_author: jvchiappini
repo_url: https://github.com/jvchiappini/FerrousEngine
repo_name: FerrousEngine

theme:
  name: material
  features:
    - navigation.expand
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Getting Started: ferrous_engine/getting-started.md
  - ferrous_engine — Application Shell:
    - Overview: ferrous_engine/README.md
    - App Builder (App<T>): ferrous_engine/app-builder.md
    - AppBuilder & Plugins: ferrous_engine/plugins.md
    - FerrousApp Trait: ferrous_engine/ferrous-app-trait.md
    - AppContext Reference: ferrous_engine/app-context.md
    - RenderContext Reference: ferrous_engine/render-context.md
    - Configuration (ferrous.toml): ferrous_engine/config.md
  - ferrous_2d — 2D Rendering:
    - Overview: ferrous_2d/README.md
    - Text: ferrous_2d/text.md
    - Images: ferrous_2d/images.md
    - Gradients: ferrous_2d/gradients.md
    - Blending and Layers: ferrous_2d/blend.md
    - Layer Effects: ferrous_2d/effects.md
    - Layer Masks: ferrous_2d/masks.md
    - Temporal Accumulation: ferrous_2d/accumulation.md
  - ferrous_ui_core — UI Core:

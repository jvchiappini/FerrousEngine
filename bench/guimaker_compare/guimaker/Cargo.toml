[package]
name = "guimaker-compare-guimaker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "guimaker-compare-guimaker"
path = "src/main.rs"

[dependencies]
guimaker = { path = "../../../crates/guimaker" }
# Phase 9D Lane C: the compare app is the minimal Flat2D bundle (no 3-D
# renderer, no SVG parser, no PNG codec), the same treatment egui's bench gets
# with `glow` + `default_fonts` only.
guimaker_gallery = { path = "../../../crates/guimaker_gallery", default-features = false, features = ["flat2d"] }
ferrous_engine = { path = "../../../crates/ferrous_engine", default-features = false, features = ["flat2d"] }
